[project]
name = "gingado"
version = "0.2.8"
description = "A machine learning library for economics and finance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Douglas K. G. de Araujo", email = "Douglas.Araujo@bis.org" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
urls = { Homepage = "https://github.com/bis-med-it/gingado" }
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3.5,<3.0",
    "sdmx1>=2.15.0",
    "scikit-learn>=1.6.1",
    "requests-cache>=0.9.1",
    "matplotlib>=3.5",
    "requests>=2.31.0",
    "keras>=3.5.0",
]

[dependency-groups]
dev = [
    "tensorflow",
    "torch",
    "statsmodels",
    "nbformat",
    "nbclient",
    "pandas-stubs",
    "pre-commit",
    "pytest",
    "jupyter",
    "jupyter-cache",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
