name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Restore docs execution cache
        uses: actions/cache@v5
        with:
          path: |
            _freeze
            .jupyter_cache
            gingado/sdmx_http_cache*
          key: ${{ runner.os }}-docs-${{ hashFiles('_quarto.yml', '*.qmd', 'gingado/**/*.py', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-

      - uses: ./.github/actions/render-docs
        with:
          token: ${{ github.token }}

